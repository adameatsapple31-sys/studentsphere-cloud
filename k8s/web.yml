apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-cloud-web
  namespace: student-cloud
spec:
  replicas: 2
  selector:
    matchLabels: { app: student-cloud-web }
  template:
    metadata:
      labels: { app: student-cloud-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/YOUR_USERNAME/student-cloud-web:latest
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 80 }
          livenessProbe:
            httpGet: { path: /health, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: student-cloud-web
  namespace: student-cloud
spec:
  selector: { app: student-cloud-web }
  ports: [{ port: 80, targetPort: 80 }]

