databases:
  - name: studentsphere-postgres
    databaseName: student_cloud
    user: student_cloud
    plan: free

services:
  - type: web
    name: studentsphere-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studentsphere-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://YOUR-VERCEL-PROJECT.vercel.app

