# Render Blueprint for the StudentSphere backend (FastAPI in Docker).
# The database is hosted on Neon (free, does not expire), so no Render database is created here.
# Values marked "sync: false" are secrets/settings you type into the Render dashboard.
# They are never stored in GitHub.
services:
  - type: web
    name: studentsphere-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # /health/live does not touch the database, so Render's frequent health checks
    # will not keep the Neon database awake 24x7 (which would use up its free compute).
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false